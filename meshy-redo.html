<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topside — Drowned Ferry Meshy Redo</title>
<style>
body{margin:0;background:#101316;color:#e8edf1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{max-width:1200px;margin:auto;padding:26px 18px 14px}
h1{margin:0 0 6px;font-size:30px}.sub{color:#aeb8c0;line-height:1.45;margin:0}
nav{margin-top:13px}a{color:#9fd5ff}.structure{max-width:1200px;margin:18px auto 32px;padding:0 18px}
.title{border-top:1px solid #34404a;padding-top:17px;margin-bottom:12px}.title h2{margin:0 0 5px}
.badge{display:inline-block;padding:4px 9px;margin-left:7px;border-radius:999px;background:#564516;color:#ffe7a0;font-size:12px;vertical-align:3px}
.note{color:#adb8c1;margin:0;line-height:1.4}.grid{display:grid;grid-template-columns:1fr;gap:13px}
.card{background:#191e23;border:1px solid #2c343c;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;height:auto}
.meta{padding:10px 13px}.meta b{display:block;margin-bottom:3px}.meta span{color:#aeb8c0;font-size:14px}
@media(min-width:850px){.grid{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}}
</style>
</head>
<body>
<header>
<h1>Drowned Ferry — Meshy Redo Review</h1>
<p class="sub">New Meshy image-to-3D hero geometry. Prior approved versions remain untouched fallbacks. Geometry + scale review only; production shaders are intentionally omitted.</p>
<nav><a href="index.html">← Main Asset Review</a></nav>
</header>
<main id="review"></main><script>
const structures=[
 {id:"08",name:"Central Stair Core V02",scale:"12 × 8 × 11.2 m",note:"Meshy ruined visual shell. Exact V01 1.4 m stair width, 177.8 mm risers and 280 mm treads remain the gameplay/collision authority."},
 {id:"09",name:"Wrecker Salvage Bell Dock V02",scale:"12.745 × 9 × 7.75 m",note:"Meshy ruined dock/gantry visual geometry. Existing Meshy 4.2 m salvage bell and winch are retained."},
 {id:"10",name:"Torn Midship Rib Field V02",scale:"30 × 5.3 × 6.6 m",note:"Meshy replacement for the Blender-direct exposed midship ruin."},
 {id:"11",name:"Collapsed Stern Shell V02",scale:"18 × 13 × 8.5 m",note:"Meshy replacement with catastrophic stern-shell damage."},
 {id:"12",name:"Bow / Loading-Door Rupture V02",scale:"32 × 14 × 11.5 m",note:"Meshy replacement; V01 bow envelope and loading-mouth scale remain authoritative."},
 {id:"13",name:"Lifeboat Deck / Davits V02",scale:"26 × 15 × 7 m",note:"Meshy replacement; V01 8.8 m lifeboat and ~6.79 m davit scale remain authoritative."},
 {id:"14",name:"Exterior Bridge / Wheelhouse V03",scale:"20 × 9 × 12 m",note:"Meshy exterior-only replacement. V02 straight companionway remains the exact gameplay connection to Structure 13."},
 {id:"15",name:"Main Galley / Food-Service Kitchen Ruin V02",scale:"18 × 12 × 6 m",note:"Meshy replacement for the greybox V01 galley. The visible hero is now generated from a dedicated ruined-galley reference image."}
];
const views=[
 ["reference","Image fed to Meshy","The isolated reference image used for Meshy image-to-3D."],
 ["perspective","Blender Perspective","Cleaned and rescaled Meshy hero mesh with 1.8 m player reference."],
 ["side","Blender Side","Orthographic scale and silhouette check."],
 ["top","Blender Top","Footprint and traversal-space check."],
 ["scale","Blender Scale Check","Player / vertical-envelope check."]
];const root=document.getElementById("review");
for(const s of structures){
 const sec=document.createElement("section");sec.className="structure";
 sec.innerHTML=`<div class="title"><h2>Structure ${s.id} — ${s.name}<span class="badge">AWAITING APPROVAL</span></h2><p class="note"><b>Scale:</b> ${s.scale}. ${s.note}</p></div><div class="grid"></div>`;
 const g=sec.querySelector(".grid");
 views.forEach((v,i)=>{
  const c=document.createElement("div");c.className="card "+(i===1?"hero":"");
  const src=`images/meshy-redo-${s.id}-${v[0]}.png`;
  c.innerHTML=`<a href="${src}" target="_blank" rel="noopener"><img loading="lazy" src="${src}" alt="Structure ${s.id} ${v[1]}"></a><div class="meta"><b>${v[1]}</b><span>${v[2]}</span></div>`;
  g.appendChild(c);
 });
 root.appendChild(sec);
}
</script>
</body>
</html>
